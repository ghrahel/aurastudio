<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="warm-sun" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b5c84"/>
      <stop offset="100%" stop-color="#eab340"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#181d2c"/>
  <!-- Vineyard rolling hills -->
  <path d="M0,520 Q300,460 600,510 T1200,480 L1200,800 L0,800 Z" fill="#21283c"/>
  <path d="M0,590 Q400,530 800,600 T1200,560 L1200,800 L0,800 Z" fill="#522D60" opacity="0.65"/>
  <path d="M0,660 Q250,620 600,670 T1200,630 L1200,800 L0,800 Z" fill="#111521"/>
  <!-- Minimalist winery architecture lines -->
  <g transform="translate(180, 240)">
    <rect x="0" y="80" width="540" height="220" fill="none" stroke="#eab340" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="30" y="110" width="480" height="190" fill="#522D60" opacity="0.4"/>
    <line x1="0" y1="80" x2="270" y2="10" stroke="#eab340" stroke-width="2.5"/>
    <line x1="270" y1="10" x2="540" y2="80" stroke="#eab340" stroke-width="2.5"/>
    <line x1="270" y1="10" x2="270" y2="300" stroke="#ebf1f7" stroke-width="1.5" opacity="0.45"/>
    <circle cx="270" cy="160" r="48" fill="none" stroke="#8eb8db" stroke-width="2.5"/>
    <text x="270" y="167" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="4">BAROSSA</text>
  </g>
  <!-- Harvest sun -->
  <circle cx="920" cy="240" r="140" fill="url(#warm-sun)" opacity="0.9"/>
  <text x="80" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" letter-spacing="5" fill="#eab340">01 / BAROSSA VALLEY VINTNERS</text>
  <text x="80" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="3" fill="#ebf1f7">WEBSITE AUDIT &amp; E-COMMERCE DTC FUNNEL</text>
</svg>
