<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="leigh-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b3b47"/>
      <stop offset="50%" stop-color="#6a6262"/>
      <stop offset="100%" stop-color="#2a2027"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#241c22"/>
  <!-- Adelaide laneway night mood & warm amber light -->
  <g transform="translate(180, 140)">
    <!-- Cobblestone / brick perspective -->
    <polygon points="120,480 340,160 500,160 720,480" fill="#382d36"/>
    <line x1="340" y1="160" x2="120" y2="480" stroke="#6a6262" stroke-width="1.5"/>
    <line x1="500" y1="160" x2="720" y2="480" stroke="#6a6262" stroke-width="1.5"/>

    <!-- Warm lantern glow in palette colors -->
    <circle cx="420" cy="180" r="160" fill="#cfd2b2" opacity="0.18"/>
    <circle cx="420" cy="180" r="80" fill="#e0d8de" opacity="0.25"/>
    <circle cx="420" cy="180" r="16" fill="#cfd2b2"/>

    <!-- Bar facade doorway -->
    <rect x="360" y="240" width="120" height="240" fill="#4b3b47" stroke="#cfd2b2" stroke-width="1.5"/>
    <rect x="380" y="260" width="80" height="120" fill="#cfd2b2" opacity="0.8"/>
    <text x="420" y="330" font-family="'Cormorant Garamond', serif" font-size="18" fill="#4b3b47" text-anchor="middle">LEIGH</text>
  </g>
  <text x="180" y="90" font-family="'Cormorant Garamond', serif" font-size="24" letter-spacing="5" fill="#cfd2b2">06 / LEIGH STREET CELLARS</text>
  <text x="180" y="115" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#9c9990">LOCAL ADELAIDE SEO &amp; EDITORIAL CONTENT</text>
</svg>
