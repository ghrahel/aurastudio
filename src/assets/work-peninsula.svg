    <text x="265" y="248" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#181d2c" text-anchor="middle" letter-spacing="2">ORGANIC</text>
  </g>
  <text x="80" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" letter-spacing="5" fill="#181d2c">02 / FLEURIEU BOTANICALS</text>
