<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <rect width="1000" height="800" fill="#ffffff"/>
  <g transform="translate(100, 80)">
    <path d="M120,620 L120,240 Q120,60 320,60 Q520,60 520,240 L520,620 Z" fill="#ffffff" stroke="#181d2c" stroke-width="4"/>
    <line x1="320" y1="60" x2="320" y2="620" stroke="#181d2c" stroke-width="2"/>
    <line x1="120" y1="260" x2="520" y2="260" stroke="#181d2c" stroke-width="2"/>
    <line x1="120" y1="440" x2="520" y2="440" stroke="#181d2c" stroke-width="2"/>
    <path d="M120,240 Q320,120 520,240" fill="none" stroke="#522D60" stroke-width="2.5"/>

    <!-- Warm Adelaide afternoon sun spill -->
    <polygon points="320,380 720,700 480,700 200,440" fill="#eab340" opacity="0.28"/>

    <!-- Timber work table -->
    <rect x="240" y="480" width="460" height="12" rx="2" fill="#181d2c"/>
    <line x1="280" y1="492" x2="260" y2="680" stroke="#181d2c" stroke-width="4"/>
    <line x1="660" y1="492" x2="680" y2="680" stroke="#181d2c" stroke-width="4"/>

    <!-- Coastal ceramic vase with eucalyptus sprig -->
    <ellipse cx="600" cy="460" rx="24" ry="34" fill="#2b5c84"/>
    <path d="M600,430 Q580,360 550,310" stroke="#181d2c" stroke-width="2.5" fill="none"/>
    <ellipse cx="560" cy="340" rx="9" ry="5" fill="#522D60" transform="rotate(-30 560 340)"/>
    <ellipse cx="585" cy="380" rx="9" ry="5" fill="#522D60" transform="rotate(25 585 380)"/>
    <ellipse cx="545" cy="310" rx="8" ry="4" fill="#b592c9" transform="rotate(-15 545 310)"/>

    <rect x="340" y="450" width="120" height="28" rx="2" fill="#f6f2f8" stroke="#522D60" stroke-width="1"/>
    <line x1="400" y1="450" x2="400" y2="478" stroke="#522D60" stroke-width="1.5"/>
  </g>
  <text x="710" y="320" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#181d2c">The Studio</text>
  <text x="710" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#522D60">FROME STREET, ADELAIDE</text>
  <text x="710" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#3e4452">
    Kaurna Yarta · Natural light,
  </text>
  <text x="710" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#3e4452">
    grounded craft &amp; clear focus.
  </text>
</svg>
