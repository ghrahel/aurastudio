<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="studio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#e0d8de"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="#f5f3ef"/>
  <!-- East End Adelaide heritage window studio setting -->
  <g transform="translate(100, 80)">
    <!-- Tall arched heritage window -->
    <path d="M120,620 L120,240 Q120,60 320,60 Q520,60 520,240 L520,620 Z" fill="#ffffff" stroke="#4b3b47" stroke-width="4"/>
    <line x1="320" y1="60" x2="320" y2="620" stroke="#4b3b47" stroke-width="2"/>
    <line x1="120" y1="260" x2="520" y2="260" stroke="#4b3b47" stroke-width="2"/>
    <line x1="120" y1="440" x2="520" y2="440" stroke="#4b3b47" stroke-width="2"/>
    <path d="M120,240 Q320,120 520,240" fill="none" stroke="#4b3b47" stroke-width="2"/>

    <!-- Soft sunlight spill across floor -->
    <polygon points="320,380 720,700 480,700 200,440" fill="#cfd2b2" opacity="0.35"/>

    <!-- Minimalist studio work table & objects -->
    <rect x="240" y="480" width="460" height="12" rx="2" fill="#4b3b47"/>
    <line x1="280" y1="492" x2="260" y2="680" stroke="#4b3b47" stroke-width="4"/>
    <line x1="660" y1="492" x2="680" y2="680" stroke="#4b3b47" stroke-width="4"/>

    <!-- Ceramic vase with olive branch -->
    <ellipse cx="600" cy="460" rx="24" ry="34" fill="#9c9990"/>
    <path d="M600,430 Q580,360 550,310" stroke="#4b3b47" stroke-width="2" fill="none"/>
    <ellipse cx="560" cy="340" rx="8" ry="4" fill="#cfd2b2" transform="rotate(-30 560 340)"/>
    <ellipse cx="585" cy="380" rx="8" ry="4" fill="#cfd2b2" transform="rotate(25 585 380)"/>
    <ellipse cx="545" cy="310" rx="7" ry="3" fill="#cfd2b2" transform="rotate(-15 545 310)"/>

    <!-- Open notebook and laptop -->
    <rect x="340" y="450" width="120" height="28" rx="2" fill="#e0d8de"/>
    <line x1="400" y1="450" x2="400" y2="478" stroke="#4b3b47" stroke-width="1"/>
  </g>
  <text x="720" y="320" font-family="'Cormorant Garamond', serif" font-size="28" fill="#4b3b47" font-style="italic">The Studio</text>
  <text x="720" y="355" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#6a6262">FROME STREET, ADELAIDE</text>
  <text x="720" y="390" font-family="sans-serif" font-size="12" fill="#9c9990" width="200">
    Kaurna Yarta · Natural light,
  </text>
  <text x="720" y="410" font-family="sans-serif" font-size="12" fill="#9c9990">
    considered pace &amp; rigorous focus.
  </text>
</svg>
