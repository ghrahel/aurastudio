<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b3b47"/>
      <stop offset="100%" stop-color="#cfd2b2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#2d242b"/>
  <!-- Minimalist architectural elevations -->
  <g transform="translate(160, 160)">
    <rect x="0" y="60" width="880" height="460" fill="none" stroke="#6a6262" stroke-width="1" stroke-dasharray="8 6"/>
    <!-- Concrete grid structure -->
    <rect x="80" y="120" width="320" height="340" fill="#4b3b47" stroke="#9c9990" stroke-width="1.5"/>
    <rect x="440" y="80" width="380" height="380" fill="#382c35" stroke="#cfd2b2" stroke-width="1.5"/>
    <!-- Louvers / facade louvers -->
    <line x1="120" y1="160" x2="360" y2="160" stroke="#cfd2b2" stroke-width="3"/>
    <line x1="120" y1="200" x2="360" y2="200" stroke="#cfd2b2" stroke-width="3"/>
    <line x1="120" y1="240" x2="360" y2="240" stroke="#cfd2b2" stroke-width="3"/>
    <line x1="120" y1="280" x2="360" y2="280" stroke="#cfd2b2" stroke-width="3"/>
    <line x1="120" y1="320" x2="360" y2="320" stroke="#cfd2b2" stroke-width="3"/>
    <line x1="120" y1="360" x2="360" y2="360" stroke="#cfd2b2" stroke-width="3"/>

    <!-- Glass atrium representation -->
    <rect x="480" y="120" width="300" height="300" fill="#e0d8de" opacity="0.15"/>
    <line x1="480" y1="120" x2="780" y2="420" stroke="#cfd2b2" stroke-width="1" opacity="0.4"/>
    <line x1="780" y1="120" x2="480" y2="420" stroke="#cfd2b2" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="160" y="110" font-family="'Cormorant Garamond', serif" font-size="24" letter-spacing="5" fill="#cfd2b2">05 / FLINDERS ARCHITECTURE</text>
  <text x="160" y="135" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#9c9990">FULL-STACK DIGITAL STRATEGY &amp; PORTFOLIO AUDIT</text>
</svg>
