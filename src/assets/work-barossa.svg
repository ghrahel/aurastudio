<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="barossa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b3b47"/>
      <stop offset="45%" stop-color="#6a6262"/>
      <stop offset="85%" stop-color="#9c9990"/>
      <stop offset="100%" stop-color="#cfd2b2"/>
    </linearGradient>
    <linearGradient id="warm-sand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d8de" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#cfd2b2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#2d242b"/>
  <!-- Vineyard topography contours -->
  <path d="M0,520 Q300,460 600,510 T1200,480 L1200,800 L0,800 Z" fill="#3f323c" opacity="0.9"/>
  <path d="M0,590 Q400,530 800,600 T1200,560 L1200,800 L0,800 Z" fill="#4b3b47" opacity="0.95"/>
  <path d="M0,660 Q250,620 600,670 T1200,630 L1200,800 L0,800 Z" fill="#2a2027"/>
  <!-- Minimalist winery architecture lines -->
  <g transform="translate(180, 240)" opacity="0.95">
    <rect x="0" y="80" width="540" height="220" fill="none" stroke="#cfd2b2" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="30" y="110" width="480" height="190" fill="#4b3b47" opacity="0.5"/>
    <line x1="0" y1="80" x2="270" y2="10" stroke="#cfd2b2" stroke-width="2"/>
    <line x1="270" y1="10" x2="540" y2="80" stroke="#cfd2b2" stroke-width="2"/>
    <line x1="270" y1="10" x2="270" y2="300" stroke="#e0d8de" stroke-width="1" opacity="0.4"/>
    <circle cx="270" cy="160" r="45" fill="none" stroke="#cfd2b2" stroke-width="1.5"/>
    <text x="270" y="165" font-family="serif" font-size="28" fill="#e0d8de" text-anchor="middle" letter-spacing="4">BAROSSA</text>
  </g>
  <!-- Solar disc / wine harvest sun -->
  <circle cx="920" cy="240" r="140" fill="url(#warm-sand)"/>
  <!-- Subtle typography badge inside illustration -->
  <text x="80" y="100" font-family="'Cormorant Garamond', serif" font-size="22" letter-spacing="6" fill="#cfd2b2" opacity="0.8">01 / BAROSSA VALLEY VINTNERS</text>
  <text x="80" y="130" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#9c9990">WEBSITE AUDIT &amp; E-COMMERCE DTC FUNNEL</text>
</svg>
